[build-system]
requires = [
    "setuptools>=70",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "nexoradb"
version = "0.1.0"
description = "NexoraDB hybrid database engine with Python API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

authors = [
    { name = "NexoraDB Team" }
]

keywords = [
    "database",
    "graph-database",
    "hybrid-database",
    "query-engine",
    "fastapi",
    "nexoradb"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = []


[project.optional-dependencies]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0"
]

dashboard = [

]

dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
    "twine>=5.0.0"
]

all = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",

]


[project.urls]
Homepage = "https://github.com/BlackProgrammer-prog/NexoraDB"
Repository = "https://github.com/BlackProgrammer-prog/NexoraDB"
Issues = "https://github.com/BlackProgrammer-prog/NexoraDB/issues"


[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true


[tool.setuptools.packages.find]
where = ["src"]
include = ["nexoradb*"]


[tool.setuptools.package-data]
nexoradb = [
    "dashboard/static/**/*",
    "dashboard/templates/**/*"
]


[tool.ruff]
line-length = 100
target-version = "py310"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B"
]
ignore = []


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "src"
]


[tool.mypy]
python_version = "3.10"
packages = ["nexoradb"]
ignore_missing_imports = true
