<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexoraDB Admin</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, Segoe UI, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #f7fbf8, #ecfdf3);
        color: #0f172a;
      }
      main {
        width: min(720px, 92vw);
        padding: 2rem;
        border-radius: 1rem;
        background: white;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        color: #15803d;
      }
      p {
        line-height: 1.6;
        color: #475569;
      }
      code {
        background: #f8fafc;
        padding: 0.15rem 0.4rem;
        border-radius: 0.35rem;
      }
      ul {
        padding-left: 1.2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>NexoraDB Admin Dashboard</h1>
      <p>
        This static bundle is served by the NexoraDB backend at
        <code>/admin</code>. For the full React admin console during development,
        run <code>nexoradb dashboard</code> or <code>nexoradb dev</code>.
      </p>
      <ul>
        <li>Backend health: <code>/health</code></li>
        <li>Admin API docs: <code>/docs</code></li>
        <li>Textual CLI: <code>nexoradb cli</code></li>
      </ul>
    </main>
  </body>
</html>
