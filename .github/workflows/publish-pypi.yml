name: Publish NexoraDB to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated wheel to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build CPython 3.10 Linux wheel
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CPython 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build patchelf

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -x vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Build native extension
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          cmake -S . -B build-wheel -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DPython_EXECUTABLE="$(command -v python)"
          cmake --build build-wheel --target nexoradb_py --parallel 2
          install -Dm755 nexoradb.cpython-310-*.so \
            NexoraDB/src/nexoradb/native/nexoradb.cpython-310-x86_64-linux-gnu.so

      - name: Build wheel
        run: |
          python -m pip install --upgrade build setuptools wheel twine auditwheel
          mkdir -p dist
          python -m build --wheel --outdir "${GITHUB_WORKSPACE}/dist" NexoraDB
          find dist -maxdepth 1 -type f -name "*.whl" -print

      - name: Repair and validate wheel
        run: |
          mkdir -p wheelhouse
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name "nexoradb-*.whl" -print)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one NexoraDB wheel, found ${#wheels[@]}" >&2
            find . -maxdepth 3 -type f -name "*.whl" -print >&2
            exit 1
          fi
          python -m auditwheel repair \
            --plat manylinux_2_35_x86_64 \
            --wheel-dir wheelhouse \
            "${wheels[0]}"
          python -m twine check wheelhouse/*.whl
          python -m auditwheel show wheelhouse/*.whl
          test "$(stat -c %s wheelhouse/*.whl)" -lt 100000000

      - name: Test wheel in a clean environment
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install wheelhouse/*.whl
          wheel-test/bin/python -c "import nexoradb; print(nexoradb.__file__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheel to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nexoradb/
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
