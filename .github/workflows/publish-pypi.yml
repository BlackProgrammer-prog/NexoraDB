name: Publish NexoraDB to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated wheel to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build CPython 3.10 Linux wheel
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up CPython 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Validate release versions
        shell: bash
        run: |
          python scripts/check_release_version.py
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            [[ "${GITHUB_REF_NAME}" == v* ]] || { echo 'Release tag must start with v'; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo 'Release commit must belong to main'; exit 1; }
            python scripts/check_release_version.py \
              --expected "${GITHUB_REF_NAME#v}"
          fi
      - name: Require main for manual publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        run: |
          if [ ! -x vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi
          git -C vcpkg checkout 7476f0d4e77d3333fbb249657df8251c28c4faae
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Set up dashboard toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and audit dashboard from the release source
        working-directory: frontend
        run: |
          node scripts/check-lockfile.mjs
          npm ci --registry=https://registry.npmjs.org
          npm audit --audit-level=high --registry=https://registry.npmjs.org
          npm run build

      - name: Build native extension
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          cmake -S . -B build-wheel -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DBUILD_TESTING=ON -DNEXORA_BUILD_GRAPH=ON
          cmake --build build-wheel --target nexoradb_py nexora_doc_tests nexora_graph_tests --parallel 2
          install -Dm755 nexoradb.cpython-310-*.so \
            NexoraDB/src/nexoradb/native/nexoradb.cpython-310-x86_64-linux-gnu.so

      - name: Native and recovery release gate
        env:
          PYTHONPATH: build-wheel
        run: |
          ctest --test-dir build-wheel --output-on-failure -j2
          python3 tests/test_native_threading_contract.py
          python3 tests/test_admin_recovery.py
          python3 tests/test_operations_metrics.py
          python3 tests/test_benchmark_history.py

      - name: Memory and cancellation release gate
        env:
          PYTHONPATH: build-wheel
          NEXORADB_TEST_NATIVE_PATH: ${{ github.workspace }}/build-wheel/nexoradb.cpython-310-x86_64-linux-gnu.so
        run: |
          python3 -m pip install -r tests/performance-requirements.txt
          python3 -m pytest -q tests/test_resource_budget.py tests/test_bounded_execution.py tests/test_execution_lifecycle.py tests/test_memory_acceptance.py tests/test_release_version.py
          python3 scripts/verify_execution_lifecycle.py --directory build-wheel/release-signal --native build-wheel/nexoradb.cpython-310-x86_64-linux-gnu.so

      - name: Build wheel
        run: |
          python -m pip install --upgrade build setuptools wheel twine auditwheel patchelf==0.17.2.4
          command -v patchelf
          patchelf --version
          mkdir -p dist
          python -m build --wheel --outdir "${GITHUB_WORKSPACE}/dist" NexoraDB
          find dist -maxdepth 1 -type f -name "*.whl" -print

      - name: Repair and validate wheel
        run: |
          mkdir -p wheelhouse
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name "*.whl" -print)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one NexoraDB wheel, found ${#wheels[@]}" >&2
            find . -maxdepth 3 -type f -name "*.whl" -print >&2
            exit 1
          fi
          python -m auditwheel repair \
            --plat manylinux_2_35_x86_64 \
            --wheel-dir wheelhouse \
            "${wheels[0]}"
          python -m twine check wheelhouse/*.whl
          python -m auditwheel show wheelhouse/*.whl
          test "$(stat -c %s wheelhouse/*.whl)" -lt 100000000

      - name: Test wheel in a clean environment
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install wheelhouse/*.whl
          wheel-test/bin/python scripts/verify_installed_package.py \
            --expected "$(python scripts/check_release_version.py | sed -n 's/^CMake: //p')"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish wheel to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nexoradatabase/
    permissions:
      id-token: write

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
